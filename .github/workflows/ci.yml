name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PICO_FIDO_SOURCE: ${{ github.workspace }}/build/public-sources/pico-fido
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.18

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Bootstrap pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bootstrap_sources.py

      - name: Run offline unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Check shell syntax
        run: bash -n scripts/*.sh
